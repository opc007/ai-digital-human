app:
  name: ai-digital-human
  env: dev
  data_dir: data

server:
  host: 0.0.0.0
  # 本机 Comfy Desktop 常用 8000，控制台默认 8100
  port: 8100

llm:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  max_history_turns: 6
  max_reply_chars: 80
  max_tokens: 120
  temperature: 0.7

tts:
  provider: minimax
  base_url: https://api.minimax.chat/v1/t2a_v2
  model: speech-02-turbo
  default_voice_id: male-qn-qingse
  # 官方 T2A language_boost：中文直播 Chinese；粤语 Chinese,Yue；多语 auto
  language_boost: Chinese
  sample_rate: 32000

avatar:
  provider: musetalk
  device: cuda
  fps: 25
  # 默认竖屏（抖音/快手/视频号）；横屏改 orientation: landscape 或 1920x1080
  orientation: portrait
  # contain=完整人物+黑边（推荐）；cover=铺满裁剪
  fit: contain
  width: 1080
  height: 1920
  model_path: models/musetalk
  fallback_mock: true

stream:
  video_bitrate: 4000k
  audio_bitrate: 128k
  video_codec: libx264
  preset: ultrafast
  tune: zerolatency
  reconnect_max: 5
  reconnect_base_sec: 2

moderation:
  enabled: true
  provider: keyword
  blocked_words:
    - 违禁示例词

limits:
  max_queue: 50
  user_msg_per_30s: 3

# 宣讲带货模式：数字人按知识库答疑 + 闲时自动宣讲产品
# 房间 yaml 里的 promo 节可逐项覆盖；默认关闭，不影响原有行为
promo:
  enabled: false
  # 画面布局：avatar_only=仅人物（原行为）| split=左网站右人物 | website_only=仅网站画面+人物声音
  layout: avatar_only
  knowledge_dir: knowledge
  promo_script: knowledge/promo_script.md
  # 队列空闲超过该秒数，自动播报下一条宣讲
  idle_seconds: 45
  product_name: "AI电影梦"
  website_url: "https://www.ainn.asia"
  website_title: "AI电影梦"
  # 网站截图后台刷新间隔（秒），0=开播抓一次不再刷新
  website_refresh_sec: 600
  kb_top_k: 3
  # 同义词召回：观众说「多少钱/贵不贵」，知识库写「售价/定价」时靠它兜底。
  # 置 0 可完全关闭（退回纯字面匹配）。同义组可在 knowledge/_aliases.txt 里追加。
  kb_aliases: true

paths:
  audio_dir: data/audio
  output_dir: data/output
  clips_dir: data/output/clips
  logs_dir: logs
